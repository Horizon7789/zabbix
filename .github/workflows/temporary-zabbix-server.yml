name: Temporary Zabbix Server

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Start Zabbix 7.4
        run: |
          docker network create zbx
          docker run -d --name postgres --network zbx             -e POSTGRES_USER=zabbix             -e POSTGRES_PASSWORD=zabbix             -e POSTGRES_DB=zabbix             postgres:16-alpine
          docker run -d --name zabbix-server --network zbx             -e DB_SERVER_HOST=postgres             -e POSTGRES_USER=zabbix             -e POSTGRES_PASSWORD=zabbix             -e POSTGRES_DB=zabbix             -e ZBX_STARTPOLLERS=5             zabbix/zabbix-server-pgsql:7.4-ubuntu-latest
          docker run -d --name zabbix-web --network zbx -p 8080:8080             -e ZBX_SERVER_HOST=zabbix-server             -e DB_SERVER_HOST=postgres             -e POSTGRES_USER=zabbix             -e POSTGRES_PASSWORD=zabbix             -e POSTGRES_DB=zabbix             -e PHP_TZ=Africa/Lagos             zabbix/zabbix-web-apache-pgsql:7.4-ubuntu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Install cloudflared
        run: |
          curl -L --fail -o cloudflared.deb             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start public tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then
              echo "ZABBIX_URL=$URL" >> "$GITHUB_ENV"
              echo "::notice title=Zabbix URL::$URL"
              echo "$URL"
              break
            fi
            sleep 2
          done

      - name: Keep server alive
        run: |
          echo "Zabbix is available at: $ZABBIX_URL"
          echo "Default login: Admin / zabbix"
          tail -f tunnel.log
