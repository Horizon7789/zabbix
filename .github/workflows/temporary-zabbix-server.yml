name: Temporary Zabbix Server

on:
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: "SSH public key authorized to access the temporary runner"
        required: true
        type: string

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Start Zabbix 7.4
        run: |
          docker network create zbx
          docker run -d --name postgres --network zbx \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e POSTGRES_DB=zabbix \
            postgres:16-alpine
          docker run -d --name zabbix-server --network zbx \
            -e DB_SERVER_HOST=postgres \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e POSTGRES_DB=zabbix \
            -e ZBX_STARTPOLLERS=5 \
            zabbix/zabbix-server-pgsql:7.4-ubuntu-latest
          docker run -d --name zabbix-web --network zbx -p 8080:8080 \
            -e ZBX_SERVER_HOST=zabbix-server \
            -e DB_SERVER_HOST=postgres \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e POSTGRES_DB=zabbix \
            -e PHP_TZ=Africa/Lagos \
            zabbix/zabbix-web-apache-pgsql:7.4-ubuntu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Install cloudflared
        run: |
          curl -L --fail -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start public tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then
              echo "ZABBIX_URL=$URL" >> "$GITHUB_ENV"
              echo "::notice title=Zabbix URL::$URL"
              echo "$URL"
              break
            fi
            sleep 2
          done

      - name: Install SSH sharing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          sudo useradd -m -s /bin/bash auditor || true
          sudo mkdir -p /home/auditor/.ssh
          sudo chmod 700 /home/auditor/.ssh
          printf '%s\n' '${{ inputs.ssh_public_key }}' | sudo tee /home/auditor/.ssh/authorized_keys >/dev/null
          sudo chmod 600 /home/auditor/.ssh/authorized_keys
          sudo chown -R auditor:auditor /home/auditor/.ssh
          sudo sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin no/' /etc/ssh/sshd_config
          echo "AllowUsers auditor" | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo /usr/sbin/sshd
          echo "Starting Pinggy TCP tunnel..."
          nohup ssh -p 443 -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -R0:127.0.0.1:22 tcp@free.pinggy.io > pinggy.log 2>&1 &
          echo "Waiting for Pinggy endpoint..."
          for i in {1..30}; do
            ENDPOINT=$(grep -Eo 'tcp://[^ ]+:[0-9]+' pinggy.log | head -1 || true)
            if [ -n "$ENDPOINT" ]; then
              HOSTPORT=$(echo "$ENDPOINT" | sed 's#tcp://##')
              HOST=$(echo "$HOSTPORT" | cut -d: -f1)
              PORT=$(echo "$HOSTPORT" | cut -d: -f2)
              SSH_CMD="ssh -i ~/.ssh/zabbix_audit -p $PORT auditor@$HOST"
              echo "SSH_COMMAND=$SSH_CMD" >> "$GITHUB_ENV"
              echo "::notice title=SSH access::$SSH_CMD"
              echo "$SSH_CMD"
              break
            fi
            sleep 2
          done
          if ! grep -Eq 'tcp://[^ ]+:[0-9]+' pinggy.log; then
            echo "ERROR: Pinggy did not provide an endpoint."
            cat pinggy.log || true
            exit 1
          fi

      - name: Keep server alive
        run: |
          echo "Zabbix is available at: $ZABBIX_URL"
          echo "Default login: Admin / zabbix"
          echo "SSH into the GitHub runner with:"
          echo "$SSH_COMMAND"
          echo "This SSH session provides shell access to the runner, including the Zabbix Docker containers."
          tail -f tunnel.log
