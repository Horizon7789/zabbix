name: Zabbix Server + Tunnel + SSH

on:
  workflow_dispatch:

jobs:
  zabbix:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Start Zabbix
        run: |
          set -e
          docker network create zbx

          docker run -d --name postgres --network zbx \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e POSTGRES_DB=zabbix \
            postgres:16-alpine

          docker run -d --name zabbix-server --network zbx \
            -e DB_SERVER_HOST=postgres \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e POSTGRES_DB=zabbix \
            -e ZBX_STARTPOLLERS=5 \
            zabbix/zabbix-server-pgsql:7.4-ubuntu-latest

          docker run -d --name zabbix-web --network zbx -p 8080:8080 \
            -e ZBX_SERVER_HOST=zabbix-server \
            -e DB_SERVER_HOST=postgres \
            -e POSTGRES_USER=zabbix \
            -e POSTGRES_PASSWORD=zabbix \
            -e POSTGRES_DB=zabbix \
            -e PHP_TZ=Africa/Lagos \
            zabbix/zabbix-web-apache-pgsql:7.4-ubuntu-latest

          echo "Waiting for Zabbix web..."
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Zabbix is ready."
              exit 0
            fi
            sleep 5
          done

          echo "Zabbix failed to become ready."
          docker ps -a
          docker logs zabbix-server || true
          docker logs zabbix-web || true
          exit 1

      - name: Start Cloudflare public tunnel
        run: |
          set -e
          curl -L --fail -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > tunnel.log 2>&1 &

          for i in {1..60}; do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then
              export ZABBIX_URL="$URL"
              echo "ZABBIX_URL=$URL" >> "$GITHUB_ENV"
              echo "::notice title=Zabbix URL::$URL"
              echo "Zabbix URL: $URL"
              break
            fi
            sleep 2
          done

          if [ -z "${ZABBIX_URL:-}" ]; then
            echo "Tunnel did not produce a URL."
            cat tunnel.log
            exit 1
          fi

      - name: Create SSH access
        timeout-minutes: 5
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmate

          rm -f /tmp/tmate.sock
          tmate -S /tmp/tmate.sock new-session -d bash

          echo "Waiting for tmate SSH endpoint..."
          SSH_CMD=""
          SSH_RO=""

          for i in {1..60}; do
            SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null | tail -1 || true)
            SSH_RO=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh_ro}' 2>/dev/null | tail -1 || true)

            if [ -n "$SSH_CMD" ] && [[ "$SSH_CMD" == ssh\ * ]]; then
              break
            fi

            echo "tmate endpoint not ready yet ($i/60)"
            sleep 5
          done

          if [ -z "$SSH_CMD" ] || [[ "$SSH_CMD" != ssh\ * ]]; then
            echo "ERROR: tmate did not provide an SSH endpoint within 5 minutes."
            echo "tmate server output:"
            tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' || true
            tmate -S /tmp/tmate.sock display -p '#{tmate_ssh_ro}' || true
            exit 1
          fi

          echo "SSH_COMMAND=$SSH_CMD" >> "$GITHUB_ENV"
          echo "SSH_READONLY=$SSH_RO" >> "$GITHUB_ENV"

          echo "::notice title=SSH access::$SSH_CMD"
          echo "SSH command: $SSH_CMD"
          echo "Read-only SSH: $SSH_RO"

      - name: Show access details
        run: |
          echo "========================================"
          echo "ZABBIX URL"
          echo "$ZABBIX_URL"
          echo
          echo "SSH COMMAND"
          echo "$SSH_COMMAND"
          echo
          echo "ZABBIX LOGIN"
          echo "Username: Admin"
          echo "Password: zabbix"
          echo "========================================"
          echo
          echo "Runner shell has access to the Zabbix Docker containers."
          echo "Keep this workflow running while using the tunnel/SSH."

      - name: Keep Zabbix and SSH alive
        run: |
          while true; do
            echo "[$(date -u)] Zabbix: $ZABBIX_URL"
            echo "[$(date -u)] SSH: $SSH_COMMAND"
            sleep 300
          done
