name: Static Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - "master"

jobs:
  cppcheck:
    name: C/C++ static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck

      - name: Run Cppcheck
        run: |
          mkdir -p analysis
          cppcheck \
            --enable=warning,performance,portability \
            --inconclusive \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --language=c \
            -j 2 \
            --xml \
            --xml-version=2 \
            src 2> analysis/cppcheck.xml || true

      - name: Publish analysis summary
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("analysis/cppcheck.xml")
          if not p.exists():
              print("Cppcheck did not produce an XML report.")
              raise SystemExit(0)

          root = ET.parse(p).getroot()
          errors = root.findall("./errors/error")
          print(f"Cppcheck findings: {len(errors)}")

          for e in errors[:100]:
              print(
                  f"- {e.get('severity','unknown')}: "
                  f"{e.get('id','unknown')}: {e.get('msg','')}"
              )
          PY

      - name: Upload Cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: analysis/cppcheck.xml
